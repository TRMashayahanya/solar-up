        justify-content: center;
        min-height: 100dvh;

        padding: 24px;

        font-weight: 700;
        background: linear-gradient(135deg, #c9a227, #e8c547);
        -webkit-background-clip: text;

      }
      .boot-sub { font-size: 12px; color: rgba(255, 255, 255, 0.45); margin: 0; }
      .boot-sun {

        animation: bootSunSpin 20s linear infinite;

      }
      .boot-sun svg { display: block; }
      @keyframes bootSunSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-sun { animation: none; } }
