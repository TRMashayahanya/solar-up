    <script>
      (function () {
        try {
          if (localStorage.getItem("solarapp-theme") === "light") {
            document.documentElement.dataset.theme = "light";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#FAFAF9");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; background: #040608; color: #f8fafc; }
      html[data-theme="light"], html[data-theme="light"] body { background: #FAFAF9; color: #1D1D1F; }
      .boot {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        gap: 14px;
        padding: 24px;
      }
      .boot-sub { font-size: 12px; color: rgba(255, 255, 255, 0.45); margin: 0; letter-spacing: 0.04em; }
      html[data-theme="light"] .boot-sub { color: rgba(18, 24, 22, 0.52); }
      .boot-sun,
      .home-brand-sun,
      .brand-header-sun .home-brand-sun {
        display: inline-flex;
        animation: bootSunSpin 20s linear infinite;
        filter: drop-shadow(0 0 16px rgba(232, 197, 71, 0.45));
      }
      .home-brand-sun { filter: drop-shadow(0 0 14px rgba(232, 197, 71, 0.4)); }
      .boot-sun svg,
      .home-brand-sun svg { display: block; }
      .boot-sun svg { width: 72px; height: 72px; }
      @keyframes bootSunSpin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-sun,
        .home-brand-sun,
        .brand-header-sun .home-brand-sun { animation: none; }
      }
    </style>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://cdn.jsdelivr.net/npm/react@18.3.1/+esm",

        }

    </script>

    <div id="root">

          </svg>
        </span>
        <p class="boot-sub">Energi Tech · Zimbabwe</p>
      </div>
    </div>
    <script type="module" src="./src/main.js?v=112"></script>
  </body>
</html>
