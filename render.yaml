# Render.com — Solar Up
# If Root Directory in dashboard is "src", use the startCommand below.
# If Root Directory is empty, use: buildCommand true + startCommand node server.mjs

services:
  - type: web
    name: solar-up
    runtime: node
    rootDir: src
    buildCommand: npm install
    startCommand: node ../server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_API_KEY
        sync: false
