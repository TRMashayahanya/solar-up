# Render.com — SolarApp (repo root; do not set Root Directory to "src" in dashboard)
services:
  - type: web
    name: solar-up
    runtime: node
    buildCommand: "true"
    startCommand: node server.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_API_KEY
        sync: false
